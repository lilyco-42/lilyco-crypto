name: build

# 本仓库禁止本地编译与运行。所有构建、测试、产物都在 GitHub Actions 上完成。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # no_std 不是嘴上说的。编到裸机 target，链接器找不到 std 就直接失败。
  no_std:
    name: no_std / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabihf
          - thumbv6m-none-eabi
          - riscv32imac-unknown-none-elf
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nostd-${{ matrix.target }}

      # 裸机没有 getrandom 后端，必须关掉 os-rng。
      # 默认无 alloc，只留 core。
      - name: 裸机编译（无 alloc）
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: 裸机编译（有 alloc）
        run: cargo build --release --features alloc --target ${{ matrix.target }}

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 单元测试
        run: cargo test --all-features --verbose

      - name: 测试无 alloc 构建
        run: cargo test --no-default-features --features os-rng --verbose

  build:
    name: build / ${{ matrix.target }}
    needs: [test, no_std]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: keygen-x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: keygen-aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: keygen-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: keygen-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: musl 工具链
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: 编译
        run: cargo build --release --features alloc,os-rng --target ${{ matrix.target }}

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          src="target/${{ matrix.target }}/release/keygen${ext}"
          mkdir -p dist
          cp "$src" "dist/${{ matrix.artifact }}"
          ls -lh dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # 发布到 crates.io，让 `cargo binstall lilyco-crypto` 能查到。
  # 顺序很重要：先发 Release 上传二进制，再发 crate——
  # 否则用户可能在 crate 可见但二进制还没上传的空窗期安装失败。
  publish:
    name: publish / crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 发布
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --registry crates-io


