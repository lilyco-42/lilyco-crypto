[package]
name = "lilyco-crypto"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "no_std 密码学工具箱：基于 RustCrypto 官方实现，提供爱发电签名、常量时间比较与卡密生成"
repository = "https://github.com/lilyco-42/lilyco-crypto"
homepage = "https://github.com/lilyco-42/lilyco-crypto"
keywords = ["no-std", "crypto", "hmac", "afdian", "license-key"]
categories = ["cryptography", "no-std"]
readme = "README.md"

[workspace]

[features]
default = []
# 需要 String / Vec / format! 时开启。
alloc = []
# 从系统熵源取随机数。裸机 target 没有后端，必须关掉。
# 需要自定义 backend 时见 https://docs.rs/getrandom/#custom-backend
os-rng = ["dep:getrandom"]

[dependencies]
# 密码学原语一律用 RustCrypto 官方实现，不自写。
# 这些 crate 都标注了 no-std 分类，经受过大量审计与实战。
md-5 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
subtle = { version = "2", default-features = false }

# 卡密需要系统熵源。裸机 target 无后端，所以放在 os-rng feature 后面。
getrandom = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
# 测试环境用 std，无需额外依赖。

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["os-rng"]

# cargo binstall 支持。
#
# 本仓库禁止本地编译，release 产物由 CI 构建并上传到 GitHub Releases。
# 资产名约定：keygen-{完整 target triple}，不带版本号——
# 版本已经体现在下载路径的 /v{ version }/ 里。
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/keygen-{ target }{ archive-suffix }"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install", "compile"]

# Linux 只产出 musl 静态二进制，但 binstall 默认按 gnu 三元组查找。
# 这里把 gnu 请求映射到同名 musl 资产：静态链接在 gnu 系统上直接可用。
[package.metadata.binstall.overrides.'cfg(all(target_os = "linux", target_env = "gnu"))']
pkg-url = "{ repo }/releases/download/v{ version }/keygen-{ target-arch }-unknown-linux-musl{ archive-suffix }"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true



